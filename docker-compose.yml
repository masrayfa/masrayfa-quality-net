services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quality_net_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quality_net_development"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./api
      # Local/test image includes development + test gems so specs can run.
      args:
        BUNDLE_WITHOUT: ""
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: quality_net_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      # Local-dev-only values (not secrets): SECRET_KEY_BASE signs JWTs and
      # ALLOWED_ORIGINS has no default — the app refuses to boot without it.
      SECRET_KEY_BASE: dev-only-not-a-secret-change-me
      ALLOWED_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  pgdata:
