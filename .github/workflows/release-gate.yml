name: release-gate

# Tag-triggered release gate (annotated `v*` tags, e.g. v1.0.0).
# Reuses the CI quality net (ci.yml `workflow_call`) and adds the register check:
# RELEASABLE only if the net is green AND the risk register has no open,
# unaccepted P0/P1. The verdict is posted as a commit status on the tagged commit.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The whole quality net (api + web) runs on the tag.
  quality_net:
    uses: ./.github/workflows/ci.yml

  # Status job: runs even when the net fails (`if: always()`), reads
  # `needs.quality_net.result` + assessment/risk-register.json, and emits
  # RELEASABLE/BLOCKED. Fail closed: a crashed script is BLOCKED too.
  gate:
    name: release-gate
    needs: [quality_net]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # post the verdict on the tag's commit
    steps:
      - uses: actions/checkout@v4

      - name: Compute gate verdict
        id: gate
        continue-on-error: true
        env:
          NET_RESULT: ${{ needs.quality_net.result }}
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/release-gate.cjs --net "$NET_RESULT" --tag "$TAG"

      - name: Publish verdict on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASABLE: ${{ steps.gate.outputs.releasable }}
        run: |
          # Annotated tag -> peel to the commit the status attaches to.
          SHA=$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || echo "${GITHUB_SHA}")
          if [ "$RELEASABLE" = "true" ]; then
            STATE=success
            DESC="RELEASABLE ${TAG}: quality net green, no unaccepted open P0/P1"
          else
            STATE=failure
            DESC="BLOCKED ${TAG}: see the release-gate run summary"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="release-gate" \
            -f description="$DESC" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "- release-gate status on \`${TAG}\` (\`${SHA}\`): **${STATE}** - ${DESC}" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATE" = "success" ]
