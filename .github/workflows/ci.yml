name: ci

# Runs on every change; `workflow_call` lets the release gate (release-gate.yml)
# reuse these jobs as its quality gate.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: quality_net_test
      SECRET_KEY_BASE: ci-test-secret
      ALLOWED_ORIGINS: "*"
      REDIS_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quality_net_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true
          working-directory: api

      # db:create + db:migrate (not db:prepare): migrations create the
      # `interview` schema the app lives in; schema.rb does not carry it.
      - name: Prepare test database
        run: bundle exec rails db:create db:migrate

      - name: Run RSpec
        run: bundle exec rspec

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run test -- --run

      - run: npm run build
